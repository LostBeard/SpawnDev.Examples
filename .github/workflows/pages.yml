name: Test and deploy demos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # ubuntu-latest also carries a newer SDK; build with 10.
      - run: dotnet new globaljson --sdk-version "$(dotnet --list-sdks | grep '^10\.' | tail -1 | cut -d' ' -f1)" --roll-forward latestFeature --force
      - run: dotnet publish BrowserApis -c Release -o _publish/BrowserApis
      - run: dotnet build Examples.Tests
      - run: pwsh Examples.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test Examples.Tests --no-build
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r _publish/BrowserApis/wwwroot _site/BrowserApis
          sed -i 's#<base href="/" />#<base href="/SpawnDev.Examples/BrowserApis/" />#' _site/BrowserApis/index.html
          grep -q '/SpawnDev.Examples/BrowserApis/' _site/BrowserApis/index.html
          rm -f _site/BrowserApis/index.html.br _site/BrowserApis/index.html.gz
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
